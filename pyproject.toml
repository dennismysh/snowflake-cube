[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snowflake-cube"
version = "0.2.0"
description = "A bijective number anonymizer (snowflake) paired with a Rubik's cube scramble randomizer"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["snowflake_anonymizer*", "rubiks_randomizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
